name: Release

# A v<X.Y.Z> tag push builds the Windows desktop version (Wails window + NSIS installer) and
# publishes the GitHub Release. No code signing (spec/environment/setup.md "リリース").
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install tools
        run: |
          go install github.com/a-h/templ/cmd/templ@"$(go list -m -f '{{.Version}}' github.com/a-h/templ)"
          go install github.com/wailsapp/wails/v3/cmd/wails3@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          choco install nsis --no-progress -y
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Package
        run: bash scripts/package-windows.sh "${GITHUB_REF_NAME#v}"

      - name: Smoke test the installer
        run: bash scripts/smoke-windows.sh "bin/mam-${GITHUB_REF_NAME#v}-windows-amd64-setup.exe"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "bin/mam-$version-windows-amd64-setup.exe" \
            "bin/mam-$version-windows-amd64.exe"
