version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gocyclo:
      min-complexity: 25
    gocognit:
      min-complexity: 50
    depguard:
      # Layer rules: handler -> service -> agent -> repository -> domain (overview.md §5).
      rules:
        domain:
          files: ["**/internal/domain/**", "!$test"]
          list-mode: lax
          allow:
            - github.com/ousiassllc/mam/backend/internal/domain/bundlepath # depends on nothing; domain's own sub-package
            - github.com/ousiassllc/mam/backend/internal/domain/modelreg # depends on nothing; the models of registered endpoints
          deny:
            - pkg: github.com/ousiassllc/mam/backend/internal
              desc: domain MUST NOT depend on any other layer
        repository:
          files: ["**/internal/repository/**", "!$test"]
          deny:
            - {pkg: github.com/ousiassllc/mam/backend/internal/agent, desc: repository depends on domain only}
            - {pkg: github.com/ousiassllc/mam/backend/internal/service, desc: repository depends on domain only}
            - {pkg: github.com/ousiassllc/mam/backend/internal/router, desc: repository depends on domain only}
            - {pkg: github.com/ousiassllc/mam/backend/internal/web, desc: repository depends on domain only}
            - {pkg: github.com/ousiassllc/mam/backend/internal/credential, desc: repository depends on domain only}
        agent:
          files: ["**/internal/agent/**", "!$test"]
          deny:
            - {pkg: github.com/ousiassllc/mam/backend/internal/service, desc: agent MUST NOT depend on service}
            - {pkg: github.com/ousiassllc/mam/backend/internal/router, desc: agent MUST NOT depend on router}
            - {pkg: github.com/ousiassllc/mam/backend/internal/web, desc: agent MUST NOT depend on web}
        service:
          files: ["**/internal/service/**", "!$test"]
          deny:
            - {pkg: github.com/ousiassllc/mam/backend/internal/router, desc: service MUST NOT depend on router}
            - {pkg: github.com/ousiassllc/mam/backend/internal/web, desc: service MUST NOT depend on web}
        handler:
          files: ["**/internal/web/handler/**", "!$test"]
          deny:
            - {pkg: github.com/ousiassllc/mam/backend/internal/repository, desc: handler MUST go through service}
            - {pkg: github.com/ousiassllc/mam/backend/internal/agent, desc: handler MUST go through service}
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-naming
        - name: error-strings
        - name: context-as-argument
        - name: unused-parameter
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, gocognit, gocyclo]
      # Complexity ratchet: gocyclo (25) / gocognit (50) stop NEW or WORSENED functions.
      # The functions below already exceed the limits; each entry is a temporary allowance
      # (like .linterly-baseline). It pins the file (`path`), the function and the complexity
      # range (limit+1 .. current value), so a bigger value, a same-named function elsewhere
      # and a new function all fail. Remove the entry when the function is split, and lower the
      # thresholds (gocyclo 20 / gocognit 40) once the list is empty. See #534, #537, #540.
      # scripts/complexity-ratchet_test.sh checks this behaviour.
      - linters: [gocognit]
        path: backend/internal/repository/project\.go
        text: 'cognitive complexity (5[1-3]) of func `\(\*ProjectRepository\)\.Apply` '
      - linters: [gocyclo]
        path: backend/internal/agent/commandinterpreter/interpreter\.go
        text: 'cyclomatic complexity (2[67]) of func `clean` '
      - linters: [gocyclo]
        path: backend/internal/agent/modeladapter/shotprompt/shotprompt\.go
        text: 'cyclomatic complexity (2[6-9]|3[01]) of func `Describe` '
      - linters: [gocyclo]
        path: backend/internal/service/chat_read\.go
        text: 'cyclomatic complexity (2[6-9]) of func `\(\*ChatService\)\.views` '
      - linters: [gocyclo]
        path: backend/internal/service/director_execute\.go
        text: 'cyclomatic complexity (2[6-9]|3[01]) of func `\(\*DirectorService\)\.execute` '

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ousiassllc/mam
