name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Self-hosted runner (org ousiassllc): GitHub-hosted runners are billed and were blocked by a payment failure.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No actions cache on the self-hosted runner: the host keeps the Go module / build and npm caches
      # itself, and the cache save of setup-go hung the job for 25+ minutes in its post step.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: make generate

      - name: Committed templ output is up to date
        run: |
          if [ -n "$(git status --porcelain -- '*_templ.go')" ]; then
            git status --short -- '*_templ.go'
            echo "::error::the committed *_templ.go differ from the .templ sources: run 'make generate' and commit"
            exit 1
          fi

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      # Known vulnerabilities reachable from the code: the Go standard library of the toolchain
      # pinned by go.mod's `toolchain` line, and the required modules. A new advisory fails CI.
      - name: Vulnerability check
        run: make vuln

      # Files / directories already over the linterly limit are recorded in .linterly-baseline: fail
      # only when something got longer or a new one went over (spec/environment/setup.md).
      - name: Line limit (no regression)
        run: make lint-lines

      # The Go tests that need ffmpeg / ffprobe (Judge frame extraction, media, Audio Director mixing,
      # Take / partial regeneration) fail without them (testenv). The self-hosted runner normally has
      # them; install via apt only when missing (needs passwordless sudo), else fail with a clear error.
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # The Lit component tests (make test-static) need a Linux Chrome. Some self-hosted runners (a WSL
      # host) only have the Windows chrome.exe, which web-test-runner cannot drive: download a Chrome for
      # Testing into the runner's tool cache (kept between runs) when there is none and CHROME_PATH is unset.
      # Both the downloader (@puppeteer/browsers, pinned by static/package-lock.json and installed by
      # `make tools`) and the Chrome version (CHROME_VERSION) are pinned so the same commit tests the same
      # browser; bump CHROME_VERSION by hand (spec/environment/setup.md). `browsers install` unpacks the
      # Chrome for Testing zip with `unzip` (without it: "Extraction failed: no zip archiver is available"):
      # like ffmpeg, install it via apt only when missing (needs passwordless sudo), else fail with a clear error.
      # The step fails when the download fails: `shell: bash` is `bash -eo pipefail` (the default `bash -e`
      # has no pipefail, so `browsers ... | tail | cut` would succeed whatever `browsers` returned and an empty
      # CHROME_PATH would be exported), and an empty or non-executable result is rejected explicitly.
      - name: Ensure Chrome
        shell: bash
        env:
          CHROME_VERSION: 155.0.8059.79
        run: |
          if [ -z "${CHROME_PATH:-}" ] && ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            if ! command -v unzip >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends unzip
            fi
            chrome="$(./static/node_modules/.bin/browsers install "chrome@${CHROME_VERSION}" --path "${RUNNER_TOOL_CACHE}/chrome-for-testing" | tail -n 1 | cut -d' ' -f2-)"
            if [ ! -x "$chrome" ]; then
              echo "::error::Chrome for Testing の取得に失敗しました（chrome='${chrome}'）"
              exit 1
            fi
            echo "CHROME_PATH=${chrome}" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: make test

      - name: Build
        run: make build

      # cmd/wails (//go:build windows) is not part of the Linux steps above: build, vet and lint the
      # Windows target so a break of the desktop version is caught on the PR. Pure Go: no CGO.
      - name: Windows build
        run: GOOS=windows CGO_ENABLED=0 go build ./backend/...

      - name: Windows vet
        run: GOOS=windows CGO_ENABLED=0 go vet ./backend/...

      - name: Windows lint
        run: GOOS=windows CGO_ENABLED=0 golangci-lint run ./backend/...
