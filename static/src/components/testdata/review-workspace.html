<div id="review-workspace" class="flex flex-col gap-6"><video class="w-full rounded-md bg-black" aria-label="レビュー対象の動画" controls preload="metadata" ></video><section class="rounded-md border border-neutral-700 p-3" aria-label="オーナーからのメモ"><h2 class="mb-1 text-sm font-semibold">オーナーからのメモ</h2><p class="whitespace-pre-wrap text-sm text-neutral-300">確認お願いします</p></section><section class="flex flex-col gap-2" aria-label="コメント"><h2 class="text-sm font-semibold">コメント</h2><div id="review-comments" class="flex flex-col gap-2"><p class="text-sm text-neutral-400">コメントはまだありません。</p><ul class="flex flex-col gap-2"></ul></div><form id="review-comment-form" class="flex flex-col gap-2 rounded-md border border-neutral-700 p-3" hx-post="/reviews/r1/comments" hx-target="#review-comments" hx-swap="outerHTML" hx-sync="this:drop" hx-disabled-elt="find button[type=submit]"><label class="flex flex-col gap-1 text-xs text-neutral-400" for="review-comment-timecode">位置（秒 または 分:秒。空なら動画全体）<input class="rounded-md border border-neutral-600 bg-neutral-950 text-neutral-100 px-2 py-1 text-sm w-32" id="review-comment-timecode" inputmode="decimal" maxlength="16" name="timecode" placeholder="1:23" type="text"></label> <label class="flex flex-col gap-1 text-xs text-neutral-400" for="review-comment-body">コメント<textarea class="rounded-md border border-neutral-600 bg-neutral-950 text-neutral-100 px-2 py-1 text-sm" id="review-comment-body" maxlength="2000" name="body" required rows="3"></textarea></label><div><button class="inline-flex items-center justify-center rounded-md font-medium transition disabled:cursor-not-allowed disabled:opacity-50 px-3 py-1.5 text-sm border border-neutral-600 text-neutral-200 hover:bg-neutral-800" type="submit">コメントを追加</button></div></form></section><section id="review-decision" class="flex flex-col gap-2 rounded-md border border-neutral-700 p-3" aria-label="判定"><h2 class="text-sm font-semibold">判定</h2><p class="text-xs text-neutral-400">応答ファイルに入るのは、表示名・判定・全体コメント・上のコメントだけです。表示名は自己申告で、確認はされません。</p><form class="flex flex-col gap-2" hx-put="/reviews/r1/decision" hx-target="#review-decision" hx-swap="outerHTML"><label class="flex flex-col gap-1 text-xs text-neutral-400" for="review-reviewer-name">表示名（1〜50 文字）<input class="rounded-md border border-neutral-600 bg-neutral-950 text-neutral-100 px-2 py-1 text-sm w-64" id="review-reviewer-name" maxlength="50" name="reviewer_name" required type="text" value=""></label><fieldset class="flex flex-wrap gap-4 text-sm"><legend class="mb-1 text-xs text-neutral-400">判定</legend> <label class="flex items-center gap-1"><input name="decision" required type="radio" value="approved">承認</label> <label class="flex items-center gap-1"><input name="decision" type="radio" value="changes_requested">修正依頼</label></fieldset><label class="flex flex-col gap-1 text-xs text-neutral-400" for="review-decision-comment">全体コメント（任意）<textarea class="rounded-md border border-neutral-600 bg-neutral-950 text-neutral-100 px-2 py-1 text-sm" id="review-decision-comment" maxlength="2000" name="comment" rows="3"></textarea></label><div><button class="inline-flex items-center justify-center rounded-md font-medium transition disabled:cursor-not-allowed disabled:opacity-50 px-3 py-1.5 text-sm bg-indigo-500 text-white hover:bg-indigo-400" type="submit">判定を保存</button></div></form><p class="text-xs text-neutral-400">判定を保存すると、オーナーに返す応答ファイルをダウンロードできます。</p></section></div>
