version: '3'

includes:
  common: ../Taskfile.yml

# Variables from scripts/package-windows.sh: VERSION (X.Y.Z) becomes the NSIS INFO_PRODUCTVERSION, the installer file name
# and the embedded backend/internal/version.Version ("v<VERSION>"; "dev" when VERSION is empty, which turns the auto update
# off); INFO_JSON is the info.json (with that version) for the exe resources. The environment variable
# RELEASE_SIGNING_PUBLIC_KEY (base64 of the raw ed25519 public key, optional) is embedded as version.ReleasePublicKey.
# Only amd64 is built.
vars:
  ARCH: "amd64"

tasks:
  build:
    summary: Builds the Wails window front (backend/cmd/wails) into bin/mam.exe, pure Go
    deps:
      - task: common:build:frontend
    cmds:
      - task: generate:syso
      - go build -tags production -trimpath -buildvcs=false -ldflags="-s -w -H windowsgui -X github.com/ousiassllc/mam/backend/internal/version.Version={{if .VERSION}}v{{.VERSION}}{{else}}dev{{end}} -X github.com/ousiassllc/mam/backend/internal/version.ReleasePublicKey={{env "RELEASE_SIGNING_PUBLIC_KEY"}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" ./backend/cmd/wails
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"

  # The .syso (icon, manifest, version info) is picked up by `go build` from the package directory.
  generate:syso:
    summary: Generates the Windows resource file for backend/cmd/wails
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info {{.INFO_JSON | default "windows/info.json"}} -out ../backend/cmd/wails/wails_windows_{{.ARCH}}.syso

  package:
    summary: Packages bin/mam.exe into the per-user NSIS installer bin/mam-<version>-windows-amd64-setup.exe
    deps:
      - task: build
    dir: build/windows/nsis
    cmds:
      # The WebView2 bootstrapper (embedded in the wails3 CLI, written here; not committed) goes into the installer.
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis -DWAILS_INSTALL_SCOPE=user -DINFO_PRODUCTVERSION={{.VERSION | default "0.0.0"}} -DARG_WAILS_AMD64_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DWAILS_INSTALL_SCOPE=user -DINFO_PRODUCTVERSION={{.VERSION | default "0.0.0"}} -DARG_WAILS_AMD64_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
