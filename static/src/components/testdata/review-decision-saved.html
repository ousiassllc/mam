<section id="review-decision" class="flex flex-col gap-2 rounded-md border border-neutral-700 p-3" aria-label="判定"><h2 class="text-sm font-semibold">判定</h2><p class="text-xs text-neutral-400">応答ファイルに入るのは、表示名・判定・全体コメント・上のコメントだけです。表示名は自己申告で、確認はされません。</p><form class="flex flex-col gap-2" hx-put="/reviews/r1/decision" hx-target="#review-decision" hx-swap="outerHTML"><label class="flex flex-col gap-1 text-xs text-neutral-400" for="review-reviewer-name">表示名（1〜50 文字）<input class="rounded-md border border-neutral-600 bg-neutral-950 text-neutral-100 px-2 py-1 text-sm w-64" id="review-reviewer-name" maxlength="50" name="reviewer_name" required type="text" value="Taro"></label><fieldset class="flex flex-wrap gap-4 text-sm"><legend class="mb-1 text-xs text-neutral-400">判定</legend> <label class="flex items-center gap-1"><input checked name="decision" required type="radio" value="approved">承認</label> <label class="flex items-center gap-1"><input name="decision" type="radio" value="changes_requested">修正依頼</label></fieldset><label class="flex flex-col gap-1 text-xs text-neutral-400" for="review-decision-comment">全体コメント（任意）<textarea class="rounded-md border border-neutral-600 bg-neutral-950 text-neutral-100 px-2 py-1 text-sm" id="review-decision-comment" maxlength="2000" name="comment" rows="3">よさそうです</textarea></label><div><button class="inline-flex items-center justify-center rounded-md font-medium transition disabled:cursor-not-allowed disabled:opacity-50 px-3 py-1.5 text-sm bg-indigo-500 text-white hover:bg-indigo-400" type="submit">判定を保存</button></div></form><div class="flex flex-wrap items-center gap-3"><span class="inline-block rounded-full px-2 py-0.5 text-xs font-medium bg-emerald-500/20 text-emerald-300">承認</span><a href="/reviews/r1/response" class="inline-flex items-center justify-center rounded-md font-medium transition disabled:cursor-not-allowed disabled:opacity-50 px-3 py-1.5 text-sm border border-neutral-600 text-neutral-200 hover:bg-neutral-800" download>応答ファイルをダウンロード（JSON）</a><span class="text-xs text-neutral-400">オーナーにこのファイルを渡してください。</span></div></section>
