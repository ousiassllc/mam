name: Release

# Builds the Windows desktop version (Wails window + per-user NSIS installer) and the macOS one (Apple Silicon, unsigned .dmg;
# release-macos.yml), signs both installers' checksums and publishes the GitHub Release. No Authenticode / Apple code signing or
# notarization (spec/environment/setup.md "リリース"). Two triggers:
#   workflow_run  ci.yml succeeded for a push to main: release main's tip as the next patch (vX.Y.Z+1 of the
#                 latest v* tag; v0.1.0 if there is none). Nobody tags anything.
#   tag push      v<X.Y.Z>: a hand-made tag, to raise the minor / major version.
#
# Every job runs on ubuntu-latest (like ci.yml) except the Mac build (the organisation's self-hosted runner). The Windows exes
# are cross-built (GOOS=windows), the installer is made by makensis on Linux. Six jobs, so that no build holds a write token
# or the signing key and nothing is published unchecked:
#   plan          decide whether to release and which tag (main's tip only: an older commit never gets a newer version)
#   verify        the commit is in main's history, passed ci.yml, and has no reachable known vulnerability
#   build-windows package the Windows exes (contents: read only; the version and the release public key are embedded)
#   build-macos   the macOS dmg on the Mac runner (contents: read, no secret; only this repository's main and v* tags)
#   sign          checksums.txt over the Windows installer AND the macOS dmg, signed; only its last script step sees the signing key
#   release       gh release create in this repository only, with the GITHUB_TOKEN; the one job with contents: write (it creates
#                 the tag too). Installed apps check this repository's Releases and verify the signature (public key embedded).
# `uses:` are pinned to a commit SHA (the comment is the tag; dependabot's github-actions keeps both up to date).
on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time: the next version is read from the existing tags, so two runs must not overlap.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The commit to release: the one CI passed on (workflow_run) or the tagged one (tag push).
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    # workflow_run fires for every CI run: only a successful push CI of this repository's main releases.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0 # all tags (the latest version) and main's tip
          persist-credentials: false

      - name: Decide the release and its tag
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]; then
            echo "::notice::$RELEASE_SHA is not main's tip any more: the run for the newer commit releases"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag --points-at "$RELEASE_SHA" --list 'v*')" ]; then
            echo "::notice::$RELEASE_SHA already has a version tag: nothing new to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$latest" ]; then
            tag=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          echo "::notice::releasing $tag (latest: ${latest:-none})"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list (the CI result of the commit)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0 # the history of main, for the ancestry check

      - name: The commit is in main's history
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::${{ needs.plan.outputs.tag }} ($RELEASE_SHA) is not in main's history: tag a commit that is merged into main"
            exit 1
          fi

      - name: ci.yml succeeded on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --json conclusion --jq 'any(.[]; .conclusion == "success")')"
          if [ "$ok" != "true" ]; then
            echo "::error::no successful CI run for $RELEASE_SHA: wait for CI to pass on this commit (or fix it) before tagging"
            exit 1
          fi

      # A GitHub-hosted runner starts empty every time: the Go and npm caches come from the actions cache (see ci.yml).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: make generate

      # A new advisory since the CI run (the release can be tagged later) stops the release too.
      - name: Vulnerability check
        run: make vuln

  build-windows:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json

      # CGO_ENABLED=0: the Wails CLI builds without cgo; with cgo on Linux it wants webkitgtk-6.0 headers.
      # (The app itself is cross-built for Windows with CGO_ENABLED=0 by wails3 package.)
      - name: Install wails3
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # makensis (NSIS) makes the installer: scripts/ensure-nsis.sh installs it when missing, without needing root.
      - name: Ensure NSIS
        run: bash scripts/ensure-nsis.sh

      # Release builds MUST embed the public key the installed apps verify the update signature with (and the version, which
      # the script takes from the tag): an exe without it would skip the signature check.
      - name: Package
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "::error::the repository variable RELEASE_SIGNING_PUBLIC_KEY is not set: a release build must embed the update signature public key"
            exit 1
          fi
          bash scripts/package-windows.sh "${TAG#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            bin/mam-*-windows-amd64*.exe
          if-no-files-found: error

  # The Mac build (reusable workflow release-macos.yml) runs on our own self-hosted Mac and this repository is public, so the
  # guard is on the job itself and holds even if the triggers are widened: a v* tag push, or a successful CI run for a push (never
  # a pull request, so never a fork's) of this repository's own main. No secrets are passed.
  build-macos:
    needs: [plan, verify]
    if: >-
      needs.plan.outputs.release == 'true' && needs.verify.result == 'success' &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/release-macos.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  sign:
    needs: [plan, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release' # windows-release and macos-release
          merge-multiple: true
          path: dist

      - name: Release notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: sed "s/VERSION/${TAG#v}/g" .github/release-notes-macos.md > dist/notes.md

      - name: Checksums # the two installers the apps install (not the portable exe)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/make-checksums.sh dist "${TAG#v}"

      # The last script step, and the only one that sees the signing key (a secret, not a write token): signs checksums.txt
      # and verifies the signature with the public key, so a key that does not match fails the job (scripts/sign-checksums.sh).
      # VERIFY_PUBLIC_KEY is the embedded key; only in the one release of a key rotation (signed with the OLD key, embedding the
      # NEW one) the variable RELEASE_SIGNING_VERIFY_PUBLIC_KEY holds the old public key.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERIFY_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_VERIFY_PUBLIC_KEY || vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: bash scripts/sign-checksums.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-meta
          path: |
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/notes.md
          if-no-files-found: error

  release:
    needs: [plan, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*' # windows-release, macos-release and release-meta
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout in this job
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          # --target creates the tag at the released commit (an existing tag, from a tag push, is kept).
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes-file dist/notes.md \
            --target "$RELEASE_SHA" \
            "dist/mam-$version-windows-amd64-setup.exe" \
            "dist/mam-$version-windows-amd64.exe" \
            "dist/mam-$version-darwin-arm64.dmg" \
            dist/checksums.txt \
            dist/checksums.txt.sig
