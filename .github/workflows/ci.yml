name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: make generate

      - name: Committed templ output is up to date
        run: |
          if [ -n "$(git status --porcelain -- '*_templ.go')" ]; then
            git status --short -- '*_templ.go'
            echo "::error::the committed *_templ.go differ from the .templ sources: run 'make generate' and commit"
            exit 1
          fi

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      # Known vulnerabilities reachable from the code: the Go standard library of the toolchain
      # pinned by go.mod's `toolchain` line, and the required modules. A new advisory fails CI.
      - name: Vulnerability check
        run: make vuln

      # Files / directories already over the linterly limit are recorded in .linterly-baseline: fail
      # only when something got longer or a new one went over (spec/environment/setup.md).
      - name: Line limit (no regression)
        run: make lint-lines

      # ubuntu-latest has no ffmpeg / ffprobe: without them the Go tests that need them (Judge frame
      # extraction, media, Audio Director mixing, Take / partial regeneration) fail in CI (testenv).
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: make test

      - name: Build
        run: make build

      # cmd/wails (//go:build windows) is not part of the Linux steps above: build, vet and lint the
      # Windows target so a break of the desktop version is caught on the PR. Pure Go: no CGO.
      - name: Windows build
        run: GOOS=windows CGO_ENABLED=0 go build ./backend/...

      - name: Windows vet
        run: GOOS=windows CGO_ENABLED=0 go vet ./backend/...

      - name: Windows lint
        run: GOOS=windows CGO_ENABLED=0 golangci-lint run ./backend/...
