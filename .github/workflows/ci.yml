name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # GitHub-hosted runner: free for a public repository, and a pull request from a fork never runs on our own
    # servers. The workflow uses no secrets and only the unprivileged pull_request trigger; the token is contents: read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A GitHub-hosted runner starts empty every time: setup-go caches the Go module and build caches
      # (key: go.sum) and setup-node the npm cache (key: static/package-lock.json) in the actions cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: make generate

      - name: Committed templ output is up to date
        run: |
          if [ -n "$(git status --porcelain -- '*_templ.go')" ]; then
            git status --short -- '*_templ.go'
            echo "::error::the committed *_templ.go differ from the .templ sources: run 'make generate' and commit"
            exit 1
          fi

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      # Known vulnerabilities reachable from the code: the Go standard library of the toolchain
      # pinned by go.mod's `toolchain` line, and the required modules, for the Linux host and the Windows
      # target (cmd/wails is //go:build windows, so a Linux-only run never analyses it). A new advisory fails CI.
      - name: Vulnerability check
        run: make vuln

      # Files / directories already over the linterly limit are recorded in .linterly-baseline: fail
      # only when something got longer or a new one went over (spec/environment/setup.md).
      - name: Line limit (no regression)
        run: make lint-lines

      # The Go tests that need ffmpeg / ffprobe (Judge frame extraction, media, Audio Director mixing,
      # Take / partial regeneration) fail without them (testenv). The GitHub-hosted ubuntu-latest image does
      # not ship them: install via apt when missing (the runner user has passwordless sudo).
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # The Lit component tests (make test-static) need a Linux Chrome. The ubuntu-latest image has its own
      # google-chrome, but its version moves with the image: always download the pinned Chrome for Testing
      # and point CHROME_PATH at it (web-test-runner uses CHROME_PATH before any installed Chrome), so the
      # same commit tests the same browser. A GitHub-hosted runner starts empty on every run, so the
      # download (under RUNNER_TOOL_CACHE) happens on every run; nothing is kept between runs.
      # Both the downloader (@puppeteer/browsers, pinned by static/package-lock.json and installed by
      # `make tools`) and the Chrome version (CHROME_VERSION) are pinned; bump CHROME_VERSION by hand
      # (spec/environment/setup.md). `browsers install` unpacks the Chrome for Testing zip with `unzip`
      # (without it: "Extraction failed: no zip archiver is available"): the image has it; like ffmpeg,
      # install it via apt only when missing.
      # The step fails when the download fails: `shell: bash` is `bash -eo pipefail` (the default `bash -e`
      # has no pipefail, so `browsers ... | tail | cut` would succeed whatever `browsers` returned and an empty
      # CHROME_PATH would be exported), and an empty or non-executable result is rejected explicitly.
      - name: Ensure Chrome
        shell: bash
        env:
          CHROME_VERSION: 155.0.8059.79
        run: |
          if ! command -v unzip >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends unzip
          fi
          chrome="$(./static/node_modules/.bin/browsers install "chrome@${CHROME_VERSION}" --path "${RUNNER_TOOL_CACHE}/chrome-for-testing" | tail -n 1 | cut -d' ' -f2-)"
          if [ ! -x "$chrome" ]; then
            echo "::error::Chrome for Testing の取得に失敗しました（chrome='${chrome}'）"
            exit 1
          fi
          echo "CHROME_PATH=${chrome}" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build
        run: make build

      # cmd/wails (//go:build windows) is not part of the Linux steps above: build, vet and lint the
      # Windows target so a break of the desktop version is caught on the PR. Pure Go: no CGO.
      - name: Windows build
        run: GOOS=windows CGO_ENABLED=0 go build ./backend/...

      - name: Windows vet
        run: GOOS=windows CGO_ENABLED=0 go vet ./backend/...

      - name: Windows lint
        run: GOOS=windows CGO_ENABLED=0 golangci-lint run ./backend/...

      # cmd/wails is also the macOS (Apple Silicon) desktop front, but a Wails build for macOS needs cgo and the Apple SDK, which
      # this Linux runner does not have: build, vet and lint everything else (the update code in internal/desktop and
      # internal/service/updater has darwin-specific paths) with GOOS=darwin GOARCH=arm64 CGO_ENABLED=0. cmd/wails itself is
      # compiled, packaged and tested on a Mac by the `macos` job below.
      - name: macOS build (without cmd/wails)
        run: |
          export GOOS=darwin GOARCH=arm64 CGO_ENABLED=0
          mapfile -t pkgs < <(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./backend/... | grep -v '/backend/cmd/wails$')
          go build "${pkgs[@]}"

      - name: macOS vet (without cmd/wails)
        run: |
          export GOOS=darwin GOARCH=arm64 CGO_ENABLED=0
          mapfile -t pkgs < <(go list ./backend/... | grep -v '/backend/cmd/wails$')
          go vet "${pkgs[@]}"

      - name: macOS lint (without cmd/wails)
        run: |
          export GOOS=darwin GOARCH=arm64 CGO_ENABLED=0
          mapfile -t dirs < <(go list -f '{{.Dir}}' ./backend/... | grep -v '/backend/cmd/wails$' | sed "s#^$PWD#.#")
          golangci-lint run "${dirs[@]}"

  # The macOS (Apple Silicon) desktop version on GitHub's hosted macos-latest: the same packaging script as release.yml's
  # `build-macos` (a dmg of version 0.0.1 without the release public key; never published), the native darwin tests of the
  # update code, and the update helper run against that real dmg. contents: read, no secret, nothing is installed. A pull
  # request from a fork does not run this job (the Mac minutes are for this repository's own branches).
  macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Package (MAM.app, ad-hoc signature, dmg)
        run: bash scripts/package-macos.sh 0.0.1

      - name: Vet cmd/wails (darwin, cgo)
        run: go vet -tags production ./backend/cmd/wails/

      # The ffmpegdl tests that serve the machine's own ffmpeg / ffprobe as the "download" (the lookup after an install) fail
      # without them (testenv), as in the `ci` job. The macos-latest image does not ship them: install via Homebrew (already on
      # the image, no sudo) when missing. Before the test step below.
      - name: Ensure ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # The native darwin tests: the update code (asset selection for darwin/arm64, the bundle and install helpers) and the
      # install of a downloaded executable (Codex app-server, ffmpeg: extraction with the exec bit, the quarantine attribute,
      # running the file, and the lookup of the installed copy with the machine's real ffmpeg).
      - name: Test the update code and the executable install on macOS
        run: go test -count=1 ./backend/internal/desktop/... ./backend/internal/service/updater/... ./backend/internal/service/appupdate/... ./backend/internal/chatgpt/codex/engine/... ./backend/internal/exeinstall/... ./backend/internal/media/ffmpegdl/...

      # The helper that applies an update, against the dmg just built: real hdiutil / ditto / xattr, the new bundle must
      # pass codesign and start (--detect-gpu), and nothing may stay mounted or on disk.
      - name: Apply the dmg with the update helper
        run: MAM_TEST_DMG="$PWD/bin/mam-0.0.1-darwin-arm64.dmg" go test -count=1 -v -run TestMacInstallScript_RealDmgReplacesTheBundle ./backend/internal/desktop/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg-${{ github.run_id }}
          path: bin/mam-0.0.1-darwin-arm64.dmg
          retention-days: 3
          if-no-files-found: error
