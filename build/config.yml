# Wails v3 build configuration of the desktop front (spec/architecture/desktop.md §4). The macOS app has its own
# build/darwin/Info.plist (the version is filled in by scripts/package-macos.sh); `info` below mirrors it.
# `wails3 package` does not read this file: the exe resources come from build/windows/info.json
# (scripts/package-windows.sh passes a copy with the release version as INFO_JSON) and the installer
# version from VERSION. Only `wails3 update build-assets` would regenerate build/windows/* from `info`,
# and nothing here runs it.
version: '3'

info:
  companyName: "ousiassllc"
  productName: "MAM"
  productIdentifier: "com.ousiassllc.mam"
  description: "Multi-agent AI video production studio"
  copyright: "(c) 2026, ousiassllc"
  comments: "Windows desktop version of mam. Runs the local server and opens it in a window."
  version: "0.0.0"
